# E7 Cross-dataset (extra) - priority: Could - NO TRAINING
# Evaluate kept checkpoints on the other dataset's test split, sentiment only, on 3 shared labels:
# E1 st_sentiment/sum (single-task baseline), E1 mtl/sum, and the E4 final model.
# trainer.train refuses this file (evaluate_only); it is run by `python -m trainer.analysis cross-eval`.
extends: configs/default.yaml
experiment: e7_cross_dataset
evaluate_only: true
sources:
  - {mode: st_sentiment, tag: sum}
  - {mode: mtl,          tag: sum}
  - {mode: mtlaware,     tag: bestloss-bestimb}
pairs:
  - {train: neu-esc,  test: uit-vsfc}
  - {train: uit-vsfc, test: neu-esc}
# Shared 3-label sentiment space, mapped by label NAME (not id), so it holds for any id order.
# NEU-ESC names are confirmed from the dataset card: neutral, positive, negative, toxic.
sentiment_map:
  neutral: neutral
  positive: positive
  negative: negative
  toxic: negative
